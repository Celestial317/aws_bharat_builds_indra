# NOT part of any kustomization. Create the real secret out-of-band and never commit values:
#
#   kubectl -n indra create secret generic indra-secrets \
#     --from-literal=LLM_API_KEY="$LLM_API_KEY" \
#     --from-literal=TELEMETRY_SERVICE_KEY="$(openssl rand -hex 24)"
apiVersion: v1
kind: Secret
metadata:
  name: indra-secrets
  namespace: indra
type: Opaque
stringData:
  LLM_API_KEY: replace-me
  TELEMETRY_SERVICE_KEY: replace-me
