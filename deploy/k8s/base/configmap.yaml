apiVersion: v1
kind: ConfigMap
metadata:
  name: indra-config
  namespace: indra
data:
  INDRA_ENV: production
  AUTH_MODE: firebase                       # production verifies Firebase ID tokens; demo mode is refused
  FIREBASE_PROJECT_ID: indra-164b4
  CORS_ORIGINS: https://indra.example.org   # overlays patch this to your real origin
  OPENSEARCH_URL: http://opensearch:9200
  OPENSEARCH_INDEX: indra-knowledge
  TELEMETRY_URL: http://telemetry:8090
  LLM_BASE_URL: https://openrouter.ai/api/v1
  LLM_MODEL: nvidia/nemotron-nano-12b-v2-vl:free
  LOG_LEVEL: INFO
