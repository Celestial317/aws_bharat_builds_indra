apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: indra
  namespace: indra
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "90"
spec:
  ingressClassName: nginx
  rules:
    - host: indra.example.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port: { name: http }
