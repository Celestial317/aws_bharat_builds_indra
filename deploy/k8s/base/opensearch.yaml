# Single-node OpenSearch for the RAG k-NN index. For production use the official OpenSearch Helm
# chart / operator with security enabled; this keeps the demo cluster self-contained.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: opensearch
  namespace: indra
  labels: { app.kubernetes.io/name: opensearch, app.kubernetes.io/part-of: indra }
spec:
  serviceName: opensearch
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: opensearch }
  template:
    metadata:
      labels: { app.kubernetes.io/name: opensearch, app.kubernetes.io/part-of: indra }
    spec:
      securityContext:
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: sysctl
          image: busybox:1.36
          command: ["sh", "-c", "sysctl -w vm.max_map_count=262144 || true"]
          securityContext: { privileged: true }
      containers:
        - name: opensearch
          image: opensearchproject/opensearch:2.17.1
          ports: [{ name: http, containerPort: 9200 }]
          env:
            - { name: discovery.type, value: single-node }
            - { name: DISABLE_SECURITY_PLUGIN, value: "true" }   # isolated by NetworkPolicy; enable TLS/auth for production
            - { name: DISABLE_INSTALL_DEMO_CONFIG, value: "true" }
            - { name: OPENSEARCH_JAVA_OPTS, value: "-Xms512m -Xmx512m" }
          resources:
            requests: { cpu: 250m, memory: 1Gi }
            limits: { cpu: "1", memory: 1536Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          readinessProbe:
            httpGet: { path: /_cluster/health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - { name: data, mountPath: /usr/share/opensearch/data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 5Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: opensearch
  namespace: indra
spec:
  selector: { app.kubernetes.io/name: opensearch }
  ports: [{ name: http, port: 9200, targetPort: http }]
